name: Azure Deployment

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Zip for deployment
        run: zip -r app.zip . -x '*.git*'

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sanwariyahotel'
          package: app.zip
